<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=http://192.168.10.1:80/">
    <title>Redirecting...</title>
    <style>
        /* Your custom styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            width: 80%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="redirectForm" style="display: none;" method="get" action="$authaction">
            <input type="hidden" name="tok" value="$tok">
            <input type="hidden" name="redir" value="http://192.168.10.1:80/">
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Replace these variables with actual values
            var authaction = "$authaction"; // Replace with your actual authentication action URL
            var tok = "$tok"; // Replace with your actual token value
            
            // Immediately submit the form when the page loads
            document.getElementById('redirectForm').submit();
        });
    </script>
</body>
</html>
